<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Array</title>
</head>
<body>
  <script>
  var food = ["pizza", "burger", "pasta", "salad"];
  var favoritefood = prompt("Enter your favorite food:");
  if (food.includes(favoritefood.toLowerCase())) {
    alert("Yes, " + favoritefood + " is in the list of foods!");
  } else {
    alert("No, " + favoritefood + " is not in the list of foods.");
  }
  
  </script>
</body>
</html>
